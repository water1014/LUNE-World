name: Deploy LUNE World to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Vendor Three.js for reliable mobile loading
        run: |
          mkdir -p vendor
          curl --fail --silent --show-error --location https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js --output vendor/three.module.js
          test -s vendor/three.module.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/three.module.js
          if ! git diff --cached --quiet; then
            git commit -m "Vendor Three.js for all Pages build paths"
            git push origin HEAD:main
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
