<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9ccca">
<meta name="description" content="LUNE，一个可以左右漫游的小小世界。">
<title>LUNE · Our little world</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap-shim">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<main class="world-screen">
  <canvas id="worldCanvas" aria-label="LUNE 全屏 2.5D 世界，可左右滑动探索"></canvas>
  <div class="scene-wash"></div>
  <header class="topbar">
    <a class="brand" href="./" aria-label="LUNE 首页"><span class="brand-mark">L</span><span class="brand-word">LUNE<small>OUR LITTLE WORLD</small></span></a>
    <div class="top-right"><span class="live-label"><i></i> A WORLD FOR TWO</span><button id="themeToggle" class="theme-toggle" aria-label="切换昼夜"><span class="sun">☼</span><span class="moon">☾</span></button></div>
  </header>
  <section class="scene-title">
    <span class="kicker" id="zoneKicker">01 / THE GARDEN</span>
    <h1 id="zoneTitle">花园</h1>
    <p id="zoneSubtitle">把日子种成喜欢的样子</p>
  </section>
  <div class="edge-hint left-hint" aria-hidden="true">‹</div>
  <div class="edge-hint right-hint" aria-hidden="true">›</div>
  <div class="drag-hint"><span>↔</span> 左右滑动，去别的角落看看</div>
  <nav class="zone-nav" aria-label="空间导航">
    <button data-zone="0"><i></i><span>花园</span></button>
    <button data-zone="1" class="active"><i></i><span>客厅</span></button>
    <button data-zone="2"><i></i><span>书房</span></button>
  </nav>
  <div class="bottom-note"><span>MADE OF LITTLE MOMENTS</span><span id="zoneCounter">02 — 03</span></div>
  <div id="loading" class="loading"><span class="loader"></span><span>正在点亮这个小世界…</span></div>
  <div id="loadError" class="load-error">小世界暂时没有加载成功。请检查网络后重新打开。</div>
  <dialog id="roomDialog">
    <div class="dialog-top"><span>LUNE / PRIVATE SPACE</span><button id="closeDialog" aria-label="关闭">×</button></div>
    <div class="dialog-content"><span id="dialogIndex" class="dialog-index">01 / 04</span><h2 id="dialogTitle">记忆相册</h2><p id="dialogDescription"></p><div class="dialog-art" id="dialogSymbol">♡</div><small>这里还空着，等你慢慢放进生活。</small></div>
  </dialog>
</main>
<script type="module-shim" src="./app.js"></script>
<script>window.setTimeout(function(){var l=document.getElementById('loading');if(l&&!l.classList.contains('hidden'))document.getElementById('loadError').classList.add('visible')},14000)</script>
</body>
</html>
